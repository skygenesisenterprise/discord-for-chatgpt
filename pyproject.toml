[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-for-chatgpt"
version = "0.1.0"
description = "Discord for ChatGPT MCP App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "mcp>=1.1.2",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "pyright>=1.1.382",
    "pip-audit>=2.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/discord_for_chatgpt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
